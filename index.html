<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stats du club, foot 5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E⚽%3C/text%3E%3C/svg%3E">
<meta name="theme-color" content="#1D6847">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F4EF; --surface:#FFFFFF; --surface-2:#E8EDE6; --ink:#13241C; --muted:#5A6C62; --line:#D8E0D6;
  --turf:#1D6847; --turf-2:#17573B; --on-turf:#F4FAF6; --chalk:rgba(255,255,255,.28);
  --bib:#E35F1B; --bib-soft:#FBE4D6; --on-bib:#FFFFFF;
  --win:#1D6847; --draw:#8C7B23; --loss:#B23A22;
  --focus:#E35F1B;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1A15; --surface:#17251F; --surface-2:#1F3028; --ink:#E9F1EC; --muted:#9BB0A4; --line:#2A3D34;
    --turf:#1F6B49; --turf-2:#195A3D; --on-turf:#F4FAF6; --chalk:rgba(255,255,255,.22);
    --bib:#FF8440; --bib-soft:#3A2418; --on-bib:#1A0E07;
    --win:#4CC28A; --draw:#D4BE55; --loss:#F07658; --focus:#FF8440;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1A15; --surface:#17251F; --surface-2:#1F3028; --ink:#E9F1EC; --muted:#9BB0A4; --line:#2A3D34;
  --turf:#1F6B49; --turf-2:#195A3D; --on-turf:#F4FAF6; --chalk:rgba(255,255,255,.22);
  --bib:#FF8440; --bib-soft:#3A2418; --on-bib:#1A0E07;
  --win:#4CC28A; --draw:#D4BE55; --loss:#F07658; --focus:#FF8440;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num,h1,h2,h3{font-family:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
h1,h2,h3{margin:0;line-height:1.1;font-weight:600}
h2{font-size:1.55rem}
h3{font-size:1.2rem}
p{margin:.3em 0}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* Barre du haut */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:10px 16px}
.crest{width:34px;height:34px;border-radius:8px;background:var(--turf);display:grid;place-items:center;flex:none}
.club{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.3rem;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.club small{display:block;font-family:"Barlow",sans-serif;font-weight:400;font-size:.78rem;color:var(--muted)}
nav.tabs{margin-left:auto;display:none;gap:4px}
nav.tabs+#acct{margin-left:8px!important}
nav.tabs button{border:0;background:none;padding:8px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:500}
nav.tabs button[aria-current="page"]{background:var(--surface-2);color:var(--ink)}
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.bottom button{flex:1;border:0;background:none;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--muted);cursor:pointer;min-height:56px}
nav.bottom button svg{width:22px;height:22px}
nav.bottom button[aria-current="page"]{color:var(--turf)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav.bottom button[aria-current="page"]{color:var(--win)}}
@media (min-width:860px){nav.tabs{display:flex}nav.bottom{display:none}}

main{max-width:1080px;margin:0 auto;padding:18px 16px 96px}
@media (min-width:860px){main{padding-bottom:48px}}
.stack>*+*{margin-top:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
@media (min-width:700px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.panel h3{margin-bottom:10px}

/* Boutons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;min-height:42px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--bib);border-color:var(--bib);color:var(--on-bib);font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:none}
.btn.danger{color:var(--loss)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:.9rem}
.link{border:0;background:none;padding:0;color:inherit;cursor:pointer;text-align:left}

/* Formulaires */
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);min-width:0}
label.f input,label.f select{color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-height:42px;width:100%}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
select.plain{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;min-height:34px;font-size:.9rem}

/* Tableau de score (élément signature) */
.board{position:relative;overflow:hidden;border-radius:20px;background:var(--turf);color:var(--on-turf);padding:22px 20px 20px}
.board svg.pitch{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.board .in{position:relative}
.board .meta{font-size:.92rem;opacity:.85}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:10px 0 4px}
.score .team{font-family:"Barlow Condensed",sans-serif;font-size:1.25rem;font-weight:600;line-height:1.1}
.score .team.r{text-align:right}
.score .big{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(3.6rem,15vw,6.5rem);line-height:.9;letter-spacing:-.01em;font-variant-numeric:tabular-nums;white-space:nowrap}
.score .big span{opacity:.5;padding:0 .08em}
.res{display:inline-block;font-weight:600;font-size:.85rem;border-radius:6px;padding:2px 8px;background:var(--on-turf);color:var(--turf)}
.board .scorers{font-size:.92rem;margin-top:8px}

.form-dots{display:flex;gap:4px}
.dot{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:.75rem;font-weight:700;color:#fff;font-family:"Barlow Condensed",sans-serif}
.dot.V{background:var(--win)}.dot.N{background:var(--draw)}.dot.D{background:var(--loss)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .dot{color:#0F1A15}}
:root[data-theme="dark"] .dot{color:#0F1A15}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.82rem;color:var(--muted);margin-top:4px}

/* Classements */
.lb ol{list-style:none;margin:0;padding:0}
.lb li{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.lb li:first-child{border-top:0}
.lb .rk{font-family:"Barlow Condensed",sans-serif;color:var(--muted);font-weight:600}
.lb .nm{min-width:0}
.lb .nm button{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.lb .bar{height:4px;border-radius:2px;background:var(--turf);margin-top:3px;opacity:.85}
.lb li:first-child .bar{background:var(--bib)}
.lb .val{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.lb .empty{color:var(--muted);font-size:.9rem}

/* Joueurs */
.badge{flex:none;width:44px;height:44px;border-radius:10px;background:var(--bib);color:var(--on-bib);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.35rem}
.badge.gk{background:var(--ink);color:var(--bg)}
.badge.lg{width:64px;height:64px;font-size:2rem;border-radius:14px}
.pcards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.pcard{display:flex;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.pcard:hover{border-color:var(--muted)}
.pcard .n{font-weight:600}
.pcard .s{font-size:.86rem;color:var(--muted)}
.pcard .stat{margin-left:auto;text-align:right}
.pcard .stat b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.5rem;line-height:1}
.pcard .stat span{font-size:.75rem;color:var(--muted)}

/* Matchs */
.mlist{display:flex;flex-direction:column;gap:8px}
.mrow{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;text-align:left;width:100%}
.mrow .d{font-size:.82rem;color:var(--muted);line-height:1.2;width:52px}
.mrow .d b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;color:var(--ink)}
.mrow .o{font-weight:600}
.mrow .t{font-size:.82rem;color:var(--muted)}
.mrow .sc{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.5rem;display:flex;gap:8px;align-items:center}

/* Ratios */
.ratios{display:grid;gap:0}
.ratio{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.ratio:first-child{border-top:0}
.ratio .l{font-weight:500}
.ratio .v{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.3rem;text-align:right;font-variant-numeric:tabular-nums}
.ratio .h{grid-column:1/-1;font-size:.8rem;color:var(--muted)}

/* Tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.92rem}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:500;color:var(--muted);font-size:.8rem}

/* Feuille de match */
.sheet{display:flex;flex-direction:column;gap:10px}
.prow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.prow.off{opacity:.65}
.prow .hd{display:flex;align-items:center;gap:10px}
.prow .hd .nm{font-weight:600;flex:1;min-width:0}
.tog{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 10px 5px 6px;cursor:pointer;font-size:.88rem;min-height:36px}
.tog i{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);display:block}
.tog[aria-pressed="true"]{background:var(--turf);border-color:var(--turf);color:var(--on-turf)}
.tog[aria-pressed="true"] i{border-color:var(--on-turf);background:var(--on-turf)}
.steps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:10px}
.stp{display:flex;align-items:center;justify-content:space-between;gap:6px;background:var(--bg);border-radius:10px;padding:4px 4px 4px 10px}
.stp .lab{font-size:.82rem;color:var(--muted);line-height:1.15}
.stp .ctl{display:flex;align-items:center;gap:2px}
.stp button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.2rem;line-height:1}
.stp .val{min-width:30px;text-align:center;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.3rem}
.sub{font-size:.8rem;color:var(--muted);margin:12px 0 0;font-weight:500}
.mini{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
.mini label.f input{min-height:38px;padding:6px 8px}
.checkbar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 6px 20px rgba(0,0,0,.08)}
@media (min-width:860px){.checkbar{bottom:12px}}
.warn{color:var(--loss);font-size:.88rem}
.okk{color:var(--win);font-size:.88rem}

.note{background:var(--bib-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.steps-intro{counter-reset:s;list-style:none;padding:0;margin:8px 0 0}
.steps-intro li{counter-increment:s;display:flex;gap:10px;padding:8px 0}
.steps-intro li::before{content:counter(s);flex:none;width:26px;height:26px;border-radius:50%;background:var(--turf);color:var(--on-turf);display:grid;place-items:center;font-family:"Barlow Condensed",sans-serif;font-weight:700}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.kt{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg);cursor:pointer;text-align:left;min-height:42px}
.kt i{flex:none;width:18px;height:18px;border-radius:5px;border:2px solid var(--muted)}
.kt[aria-pressed="true"]{border-color:var(--turf)}
.kt[aria-pressed="true"] i{background:var(--turf);border-color:var(--turf)}
.kt small{color:var(--muted);margin-left:auto;font-size:.75rem}
.roster{display:flex;flex-direction:column}
.roster .r{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.roster .r:first-child{border-top:0}
.roster .r .nm{flex:1;min-width:120px}
details{border-top:1px solid var(--line);padding-top:10px}
summary{cursor:pointer;font-weight:600}
.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;max-width:min(92vw,480px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (min-width:860px){.toast{bottom:24px}}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;resize:vertical;line-height:1.45}
.st{display:inline-block;font-size:.78rem;font-weight:600;border-radius:6px;padding:1px 8px;border:1px solid currentColor;white-space:nowrap}
.st.ok{color:var(--win)}.st.part{color:var(--draw)}.st.due{color:var(--loss)}.st.ex{color:var(--muted)}
.pbar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:6px}.pbar i{display:block;height:100%;background:var(--turf)}
.frow{padding:10px 0;border-top:1px solid var(--line)}.frow:first-child{border-top:0}
.frow .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.frow .top .nm{flex:1;min-width:120px;font-weight:600}
.frow .amt{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.fbox{background:var(--bg);border-radius:12px;padding:12px;margin-top:10px}
.av{flex:none;object-fit:cover;display:block;background:var(--surface-2)}
.pstrip{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;-webkit-overflow-scrolling:touch}
.pchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 6px;min-width:78px;cursor:pointer;font-size:.8rem;font-weight:500}
.pchip[aria-pressed="true"]{border-color:var(--bib);background:var(--bib-soft)}
.st-table td.on{font-weight:700}
.sb{border:0;background:none;color:inherit;font:inherit;cursor:pointer;padding:2px 0;white-space:nowrap}
.link.pl,.cmp .pl{display:inline-flex;align-items:center;gap:8px;min-width:0}
.phys .pbig{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(3.4rem,15vw,6rem);line-height:.9;margin-top:8px;font-variant-numeric:tabular-nums}
.phys .pbig small{font-size:.38em;opacity:.8}
.phys-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px;margin-top:14px}
.phys-grid div{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px}
.phys-grid b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:1.45rem;line-height:1.1}
.phys-grid span{font-size:.78rem;opacity:.88;line-height:1.25;display:block}
.cmp{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin-top:8px;font-size:.9rem}
.cmp.wide{grid-template-columns:minmax(0,130px) 1fr auto}
.cmp .cb{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.cmp .cb i{display:block;height:100%;background:var(--bib);border-radius:5px}
.cmp.t .cb i{background:var(--turf)}
.cmp b{font-family:"Barlow Condensed",sans-serif;font-size:1.1rem;white-space:nowrap}
a.mrow{text-decoration:none;color:inherit}.mrow.league{grid-template-columns:auto 1fr auto}.lg-ic{font-size:1.5rem}
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,20,15,.55);display:flex;align-items:flex-end;justify-content:center;padding:0 0 env(safe-area-inset-bottom,0px)}
.ovp{background:var(--surface);color:var(--ink);width:100%;max-width:620px;max-height:92vh;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 16px 20px}
@media (min-width:700px){.ov{align-items:center}.ovp{border-radius:18px}}
.ovchart{background:var(--bg);border-radius:12px;padding:8px;margin:8px 0 12px}
.ovsum div{background:var(--bg)}.ovsum b{color:var(--ink)}.ovsum span{color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--bib);min-height:32px}
.empty-state{text-align:center;padding:32px 16px}
@media (prefers-reduced-motion:no-preference){.board .big{animation:pop .5s ease-out both}@keyframes pop{from{transform:translateY(6px);opacity:0}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="crest" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 4.5h-5L8 10z"/><path d="M12 3v4M21 10l-5 0M18 19l-3.5-4.5M6 19l3.5-4.5M3 10h5"/></svg></div>
  <div class="club" id="clubName">Chargement…</div>
  <nav class="tabs" id="tabs" aria-label="Navigation"></nav>
  <div id="acct" style="margin-left:auto;flex:none"></div>
</div></header>
<main id="app" aria-live="polite"></main>
<nav class="bottom" id="bottom" aria-label="Navigation"></nav>
<div id="toast" class="toast" hidden></div>

<script>

function showFatal(m){ const a=document.getElementById('app'); if(a) a.innerHTML='<section class="panel" style="max-width:560px;margin:24px auto"><h2>L\u2019app n\u2019a pas pu démarrer</h2><p class="muted">Erreur : '+String(m).replace(/[<>&]/g,'')+'</p><p class="muted small">Envoie ce message au responsable de l\u2019app.</p></section>'; }

<script>
"use strict";
/* ---------- Catalogue des indicateurs ---------- */
const KPIS = [
  {k:'goals',l:'Buts',s:'B',g:'jeu',def:1},
  {k:'assists',l:'Passes décisives',s:'PD',g:'jeu',def:1},
  {k:'shots',l:'Tirs',s:'Tirs',g:'jeu',def:1},
  {k:'shotsOn',l:'Tirs cadrés',s:'Cadrés',g:'jeu',def:1},
  {k:'recoveries',l:'Ballons récupérés',s:'Récup.',g:'jeu',def:1},
  {k:'losses',l:'Ballons perdus',s:'Pertes',g:'jeu'},
  {k:'dribbles',l:'Dribbles réussis',s:'Dribbles',g:'jeu'},
  {k:'blocks',l:'Tirs contrés',s:'Contres',g:'jeu'},
  {k:'rating',l:'Note du match (sur 10)',s:'Note',g:'jeu',def:1,rating:1},
  {k:'fouls',l:'Fautes commises',s:'Fautes',g:'discipline'},
  {k:'exclusions',l:'Cartons / exclusions',s:'Excl.',g:'discipline'},
  {k:'ownGoals',l:'Buts contre son camp',s:'CSC',g:'discipline'},
  {k:'saves',l:'Arrêts',s:'Arrêts',g:'gardien',def:1},
  {k:'conceded',l:'Buts encaissés',s:'Encaissés',g:'gardien',def:1},
  {k:'oneVsOne',l:'Duels 1 contre 1 gagnés',s:'1c1',g:'gardien'},
  {k:'penSaved',l:'Penaltys arrêtés',s:'Pen.',g:'gardien'},
  {k:'throwsOk',l:'Relances réussies',s:'Rel. OK',g:'gardien'},
  {k:'throwsTot',l:'Relances tentées',s:'Rel.',g:'gardien'},
  {k:'km',l:'Distance (km)',s:'km',g:'physique',def:1,dec:1},
  {k:'hrAvg',l:'Fréquence cardiaque moyenne',s:'FC moy',g:'physique',dec:1},
  {k:'hrMax',l:'Fréquence cardiaque max',s:'FC max',g:'physique',dec:1},
  {k:'vmax',l:'Vitesse max (km/h)',s:'Vmax',g:'physique',dec:1},
];
const GROUPS = {jeu:'Jeu',discipline:'Discipline',gardien:'Gardien de but',physique:'Physique (montre)'};
const KMAP = Object.fromEntries(KPIS.map(d=>[d.k,d]));
const GPS_KEYS = ['km','hrAvg','hrMax','vmax'];
const TYPES = {championnat:'Championnat',coupe:'Coupe',amical:'Amical',entrainement:'Entraînement'};
const POS = {champ:'Joueur de champ',gardien:'Gardien',polyvalent:'Polyvalent'};
const CONVOC = {oui:'Présent',peutetre:'Peut-être',non:'Absent'};
const PAYMODES = ['Espèces','Virement','CB','Chèque','Lydia / PayPal'];
const DEFAULTS = {clubName:'Mon club de foot 5',matchLength:50,seasonStartMonth:9,leagueUrl:'https://myurban.fr/',kpis:KPIS.filter(d=>d.def).map(d=>d.k)};

/* ---------- État ---------- */
const S = {
  ready:false, local:false, db:null, user:null, uid:null, canEdit:false,
  settings:null, players:[], matches:[], profiles:[], names:{},
  view:'tableau', playerId:null, matchId:null,
  filter:{period:'season',type:'all'},
  editing:null, editDirty:false, prof:null, profDirty:false, setDraft:null, setDirty:false,
  editPlayer:null, showArchived:false, plan:null, planDirty:false, feeSeason:null, feeOpen:null, fees:[], got:{s:0,p:0,m:0,pr:0,f:0}
};
const L = {settings:null,players:{},matches:{},profiles:{},fees:{}};

/* ---------- Utilitaires ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const nf = (v,d=0) => isNum(v) ? v.toLocaleString('fr-FR',{minimumFractionDigits:0,maximumFractionDigits:d}) : '—';
const pct = (a,b) => b>0 ? nf(100*a/b,0)+' %' : '—';
const rid = () => Array.from(crypto.getRandomValues(new Uint8Array(10)),b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const fdate = (d,o={day:'numeric',month:'short',year:'numeric'}) => d ? new Date(d+'T12:00:00').toLocaleDateString('fr-FR',o) : '';
const parseNum = s => { if(s===''||s==null) return null; const v=parseFloat(String(s).replace(',','.')); return isFinite(v)?v:null; };
const clone = o => JSON.parse(JSON.stringify(o));
function cfg(){ return Object.assign({}, DEFAULTS, S.settings||{}); }
function on(k){ return cfg().kpis.includes(k); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3200); }
/* ---------- Configuration Supabase : colle tes deux valeurs ici ---------- */
const SUPABASE_URL = 'https://lqmbejarmujpxrejovby.supabase.co';          // ex. https://abcdefgh.supabase.co
const SUPABASE_KEY = 'sb_publishable_ymrYYbbkgWX_2B5qjmwzeA_4MWqcCnj'; // clé publique, pas la clé secrète
const configured = () => /^https:\/\/[a-z0-9-]+\.supabase\.co\/?$/.test(SUPABASE_URL.trim().replace(/\/rest\/v1\/?$/,'')) && SUPABASE_KEY.length > 20 && !SUPABASE_KEY.startsWith('COLLE');

function errMsg(e){
  const c=e&&(e.code||''), m=String(e&&e.message||'');
  if(c==='42501'||/row-level security|permission/i.test(m)) return "Enregistrement refusé : ton accès ne permet pas de modifier cette donnée. Demande au responsable du club.";
  if(c==='23505') return "Cet élément existe déjà.";
  if(c==='23514') return "Donnée refusée : fichier trop lourd ou format non autorisé.";
  return "Enregistrement impossible pour le moment. Vérifie ta connexion et réessaie.";
}

/* ---------- Stockage ---------- */
const queue = {};
let sb=null;
function applyRow(col,id,data){
  if(col==='club'&&id==='settings') L.settings=data;
  else if(L[col]) L[col][id]=Object.assign({},data);
}
function dropRow(col,id){
  if(col==='club'&&id==='settings') L.settings=null;
  else if(L[col]) delete L[col][id];
}
function write(path, data){
  const [col,id]=path.split('/');
  if(col==='profiles'&&S.email) data=Object.assign({},data,{email:S.email});
  applyRow(col,id,data); syncLocal();
  if(S.local) return Promise.resolve(true);
  const p=(queue[path]||Promise.resolve())
    .then(()=>sb.from('docs').upsert({col,id,data,updated_at:new Date().toISOString()}))
    .then(({error})=>{ if(error) throw error; return true; })
    .catch(e=>{ toast(errMsg(e)); loadAll(); return false; });
  queue[path]=p; return p;
}
function remove(path){
  const [col,id]=path.split('/');
  dropRow(col,id); syncLocal();
  if(S.local) return Promise.resolve(true);
  const p=(queue[path]||Promise.resolve())
    .then(()=>sb.from('docs').delete().eq('col',col).eq('id',id))
    .then(({error})=>{ if(error) throw error; return true; })
    .catch(e=>{ toast(errMsg(e)); loadAll(); return false; });
  queue[path]=p; return p;
}
async function loadAll(){
  const rows=[]; const step=1000;
  for(let from=0;;from+=step){
    const {data,error}=await sb.from('docs').select('col,id,data').range(from,from+step-1);
    if(error){ toast("Impossible de charger les données du club."); break; }
    rows.push(...data); if(data.length<step) break;
  }
  L.settings=null; L.players={}; L.matches={}; L.profiles={}; L.fees={};
  for(const r of rows) applyRow(r.col,r.id,r.data);
  syncLocal();
}
async function loadMembers(){
  if(S.local||!sb) return;
  const {data}=await sb.from('club_members').select('email,role').order('email');
  S.members=data||[]; if(S.view==='reglages'&&!S.setDirty) render();
}
function syncLocal(){
  S.settings=L.settings;
  S.players=Object.entries(L.players).map(([id,d])=>({id,...d}));
  S.matches=Object.entries(L.matches).map(([id,d])=>({id,...d})).sort(byDate);
  S.profiles=Object.entries(L.profiles).map(([id,d])=>({id,...d}));
  S.fees=Object.entries(L.fees).map(([id,d])=>({id,...d}));
  render(true);
}
const byDate=(a,b)=>(b.date||'').localeCompare(a.date||'');

/* ---------- Données dérivées ---------- */
function players(all){ return S.players.filter(p=>all||p.active!==false).sort((a,b)=>(a.name||'').localeCompare(b.name||'','fr')); }
function player(id){ return S.players.find(p=>p.id===id); }
function myProfile(){ return S.profiles.find(p=>p.id===S.uid); }
function profileOf(pid){
  const list=S.profiles.filter(p=>p.playerId===pid);
  if(!list.length) return null;
  return list.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))[0];
}
function pname(p){ return p ? (p.name||'Sans nom') : 'Joueur retiré'; }
function pinfo(pid){
  const p=player(pid)||{}, pr=profileOf(pid)||{};
  return {
    name:pname(player(pid)), number:p.number, position:p.position||pr.prefPos||'champ',
    nickname:pr.nickname||'', foot:pr.foot||'', height:pr.height||null, birth:pr.birth||'',
    active:p.active!==false
  };
}
function weightsOf(pid){
  const p=player(pid)||{}, pr=profileOf(pid)||{};
  return [...(p.weights||[]),...(pr.weights||[])].filter(w=>w&&w.d&&isNum(w.kg)).sort((a,b)=>a.d.localeCompare(b.d));
}
function weightAt(pid, date){
  const w=weightsOf(pid); let r=null;
  for(const x of w){ if(x.d<=date) r=x; else break; }
  return r;
}
function seasonStart(){
  const now=new Date(), sm=(cfg().seasonStartMonth||9)-1; let y=now.getFullYear(); if(now.getMonth()<sm) y--;
  return y+'-'+String(sm+1).padStart(2,'0')+'-01';
}
function played(){ return S.matches.filter(m=>!m.planned); }
function upcoming(){ return S.matches.filter(m=>m.planned).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||''))); }
function convCounts(m){ const c={oui:0,peutetre:0,non:0,attente:0}; for(const v of Object.values(m.convoc||{})) c[v in c?v:'attente']++; return c; }
function FM(){
  const f=S.filter; let from=null;
  if(f.period==='season') from=seasonStart();
  if(f.period==='30d'){ const d=new Date(Date.now()-30*864e5); from=d.toISOString().slice(0,10); }
  return played().filter(m=>(!from||m.date>=from)&&(f.type==='all'||m.type===f.type));
}
function result(m){
  if(!isNum(m.scoreFor)||!isNum(m.scoreAgainst)) return null;
  return m.scoreFor>m.scoreAgainst?'V':m.scoreFor<m.scoreAgainst?'D':'N';
}
function rec(m,pid){
  const r=m.stats&&m.stats[pid]; if(!r||!r.present) return null;
  const out=Object.assign({},r);
  const g=(profileOf(pid)||{}).gps; const gm=g&&g[m.id];
  if(gm) for(const k of GPS_KEYS) if(!isNum(out[k])&&isNum(gm[k])) out[k]=gm[k];
  return out;
}
function agg(pid, ms){
  const a={n:0,motm:0,min:0,V:0,N:0,D:0,tot:{},cnt:{},gkN:0,gkMin:0,cs:0,teamGoals:0,rows:[]};
  const half=cfg().matchLength/2;
  for(const m of ms){
    const r=rec(m,pid); if(!r) continue;
    a.n++; if(m.motm===pid) a.motm++; a.min+=isNum(r.min)?r.min:(m.duration||cfg().matchLength);
    const res=result(m); if(res) a[res]++;
    if(isNum(m.scoreFor)) a.teamGoals+=m.scoreFor;
    for(const d of KPIS){ const v=r[d.k]; if(isNum(v)){ a.tot[d.k]=(a.tot[d.k]||0)+v; a.cnt[d.k]=(a.cnt[d.k]||0)+1; } }
    if(r.gk){ a.gkN++; const gm=isNum(r.gkMin)?r.gkMin:(m.duration||cfg().matchLength); a.gkMin+=gm; if((r.conceded||0)===0&&gm>=half) a.cs++; }
    a.rows.push({m,r});
  }
  return a;
}
const T=(a,k)=>a.tot[k]||0;
const avg=(a,k)=>a.cnt[k]?a.tot[k]/a.cnt[k]:null;

function ratiosFor(a){
  const Lm=cfg().matchLength, out=[];
  if(!a.n) return out;
  const add=(need,l,v,h)=>{ if(need.every(on)) out.push({l,v,h}); };
  add(['goals'],'Buts par match',nf(T(a,'goals')/a.n,2),'Total des buts divisé par le nombre de matchs joués.');
  add(['goals'],`Buts par ${Lm} min`,a.min?nf(T(a,'goals')/a.min*Lm,2):'—',`Ramené au temps réellement joué : utile avec les rotations du foot 5.`);
  add(['goals','assists'],'Buts + passes D par match',nf((T(a,'goals')+T(a,'assists'))/a.n,2),'Participation directe aux buts.');
  add(['goals','assists'],'Implication offensive',pct(T(a,'goals')+T(a,'assists'),a.teamGoals),"Part des buts de l'équipe où il marque ou fait la passe, sur ses matchs.");
  add(['goals','shots'],'Efficacité devant le but',pct(T(a,'goals'),T(a,'shots')),'Buts divisés par tirs.');
  add(['shots','shotsOn'],'Précision des tirs',pct(T(a,'shotsOn'),T(a,'shots')),'Tirs cadrés divisés par tirs.');
  add(['recoveries','losses'],'Récupérations / pertes',T(a,'losses')?nf(T(a,'recoveries')/T(a,'losses'),2):'—','Au-dessus de 1 : il rend plus de ballons qu\u2019il n\u2019en perd.');
  add(['recoveries'],'Récupérations par match',nf(T(a,'recoveries')/a.n,1),'');
  add(['fouls'],'Fautes par match',nf(T(a,'fouls')/a.n,1),'En foot 5, le cumul de fautes d\u2019équipe coûte cher.');
  add(['rating'],'Note moyenne',avg(a,'rating')!=null?nf(avg(a,'rating'),1)+' / 10':'—',`Sur ${a.cnt.rating||0} match(s) noté(s).`);
  add(['km'],'Distance par match',avg(a,'km')!=null?nf(avg(a,'km'),2)+' km':'—',`Sur ${a.cnt.km||0} match(s) avec données montre.`);
  add(['km'],'Distance par 10 min',(()=>{let km=0,min=0;for(const {m,r} of a.rows){if(isNum(r.km)){km+=r.km;min+=isNum(r.min)?r.min:(m.duration||Lm);}}return min?nf(km/min*10,2)+' km':'—';})(),"L'intensité de course, indépendante du temps de jeu.");
  out.push({l:'Taux de victoire',v:pct(a.V,a.V+a.N+a.D),h:`${a.V} V · ${a.N} N · ${a.D} D quand il joue.`});
  return out;
}
function gkRatios(a){
  const Lm=cfg().matchLength, out=[];
  if(!a.gkN) return out;
  const sv=T(a,'saves'), cc=T(a,'conceded');
  if(on('saves')&&on('conceded')) out.push({l:'Pourcentage d\u2019arrêts',v:pct(sv,sv+cc),h:'Arrêts divisés par tirs cadrés subis (arrêts + buts encaissés).'});
  if(on('conceded')) out.push({l:`Buts encaissés par ${Lm} min`,v:a.gkMin?nf(cc/a.gkMin*Lm,2):'—',h:'Calculé sur le temps passé dans les buts uniquement.'});
  out.push({l:'Clean sheets',v:`${a.cs} / ${a.gkN}`,h:'Matchs sans encaisser en ayant gardé au moins la moitié du match.'});
  if(on('throwsOk')&&on('throwsTot')) out.push({l:'Relances réussies',v:pct(T(a,'throwsOk'),T(a,'throwsTot')),h:'Le gardien est le premier relanceur en foot 5.'});
  if(on('oneVsOne')) out.push({l:'Duels 1 contre 1 gagnés',v:nf(T(a,'oneVsOne')),h:''});
  if(on('penSaved')) out.push({l:'Penaltys arrêtés',v:nf(T(a,'penSaved')),h:''});
  return out;
}

/* ---------- Rendu ---------- */
const ICONS={
  tableau:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16M3 12h4M17 12h4"/><circle cx="12" cy="12" r="2.5"/></svg>',
  matchs:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  effectif:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-6M20 20V9"/></svg>',
  profil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>',
  cotisations:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></svg>',
  reglages:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>'
};
function navItems(){ const n=[['tableau','Tableau'],['matchs','Matchs'],['effectif','Stats'],['profil','Mon profil','Profil']]; if(S.canEdit){ n.push(['cotisations','Cotisations','Cotis.']); n.push(['reglages','Réglages']); } return n; }
function renderNav(){
  const cur=S.view, okk=S.local||S.auth==='ok';
  document.getElementById('acct').innerHTML=(!S.local&&S.auth==='ok')?'<button class="btn ghost sm" data-a="logout">Déconnexion</button>':'';
  if(!okk){ document.getElementById('tabs').innerHTML=''; document.getElementById('bottom').innerHTML=''; document.getElementById('clubName').innerHTML='Stats du club<small>Foot 5</small>'; return; }
  document.getElementById('tabs').innerHTML=navItems().map(([id,l])=>`<button data-a="nav" data-v="${id}" ${cur===id?'aria-current="page"':''}>${l}</button>`).join('');
  document.getElementById('bottom').innerHTML=navItems().map(([id,l,sh])=>`<button data-a="nav" data-v="${id}" ${cur===id?'aria-current="page"':''}>${ICONS[id]}<span>${sh||l}</span></button>`).join('');
  const c=cfg();
  document.getElementById('clubName').innerHTML=`${esc(c.clubName)}<small>${S.local?'Mode essai, données non enregistrées':esc(S.email||'Statistiques foot 5')}</small>`;
  document.title=c.clubName+' · stats foot 5';
}
function render(fromData){
  renderNav();
  if(!S.local&&S.auth!=='ok'){ document.getElementById('app').innerHTML=vAuth(); return; }
  if(fromData && ((S.editing&&S.editDirty)||(S.plan&&S.planDirty)||S.profDirty||S.setDirty)) return;
  const app=document.getElementById('app');
  if(!S.ready){ app.innerHTML='<p class="muted">Chargement des données du club…</p>'; return; }
  let h='';
  if(S.view==='matchs') h=S.editing?vEditor():S.plan?vPlan():(S.matchId?vMatch():vMatches());
  else if(S.view==='cotisations') h=vFees();
  else if(S.view==='effectif') h=vStats();
  else if(S.view==='profil') h=vProfile();
  else if(S.view==='reglages') h=vSettings();
  else h=vDashboard();
  app.innerHTML=h;
  if(S.view==='reglages') resolveNames();
}

function filtersBar(){
  const f=S.filter;
  return `<div class="spread">
    <div class="chips" role="group" aria-label="Type de match">${[['all','Tous'],...Object.entries(TYPES)].map(([k,l])=>`<button class="chip" data-a="ftype" data-v="${k}" aria-pressed="${f.type===k}">${l}</button>`).join('')}</div>
    <select class="plain" data-a="fperiod" aria-label="Période">
      <option value="season" ${f.period==='season'?'selected':''}>Saison en cours</option>
      <option value="30d" ${f.period==='30d'?'selected':''}>30 derniers jours</option>
      <option value="all" ${f.period==='all'?'selected':''}>Depuis le début</option>
    </select></div>`;
}
const PITCH=`<svg class="pitch" viewBox="0 0 400 200" preserveAspectRatio="none" aria-hidden="true"><g fill="none" stroke="var(--chalk)" stroke-width="2"><rect x="8" y="8" width="384" height="184" rx="6"/><line x1="200" y1="8" x2="200" y2="192"/><circle cx="200" cy="100" r="34"/><path d="M8 52 a48 48 0 0 1 0 96"/><path d="M392 52 a48 48 0 0 0 0 96"/></g></svg>`;

function scorersLine(m){
  if(!on('goals')) return '';
  const ss=Object.entries(m.stats||{}).filter(([,r])=>r.present&&r.goals>0).sort((a,b)=>b[1].goals-a[1].goals).map(([pid,r])=>`${esc(pname(player(pid)))}${r.goals>1?' ×'+r.goals:''}`);
  return ss.length?`<div class="scorers">Buteurs : ${ss.join(', ')}</div>`:'';
}
function vBoard(m){
  const c=cfg(), res=result(m);
  return `<section class="board">${PITCH}<div class="in">
    <div class="meta">${esc(TYPES[m.type]||'Match')} · ${fdate(m.date,{weekday:'long',day:'numeric',month:'long'})}${m.place?' · '+esc(m.place):''}</div>
    <div class="score"><div class="team">${esc(c.clubName)}</div>
      <div class="big num">${isNum(m.scoreFor)?m.scoreFor:'–'}<span>–</span>${isNum(m.scoreAgainst)?m.scoreAgainst:'–'}</div>
      <div class="team r">${esc(m.opponent||'Adversaire')}</div></div>
    ${res?`<span class="res">${{V:'Victoire',N:'Match nul',D:'Défaite'}[res]}</span>`:''}
    ${scorersLine(m)}${m.motm&&player(m.motm)?`<div class="scorers">Homme du match : ${esc(pname(player(m.motm)))}</div>`:''}</div></section>`;
}

function vDashboard(){
  const ps=players(true), ms=FM(), c=cfg();
  let h='<div class="stack">';
  if(!S.players.length){
    h+= S.canEdit ? `<section class="panel"><h2>Bienvenue sur l\u2019app du club</h2><p class="muted">Trois étapes pour démarrer :</p>
      <ol class="steps-intro"><li><div><b>Ajoute tes joueurs</b> dans Réglages, avec leur numéro et leur poste.</div></li>
      <li><div><b>Partage l\u2019app</b> à tes joueurs avec l\u2019accès « Contributeur » : chacun pourra remplir son profil et son poids.</div></li>
      <li><div><b>Saisis ton premier match</b> depuis l\u2019onglet Matchs.</div></li></ol>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-a="nav" data-v="reglages">Ajouter les joueurs</button></div></section>`
    : `<section class="panel empty-state"><h2>L\u2019effectif n\u2019est pas encore créé</h2><p class="muted">Le responsable du club doit d\u2019abord ajouter les joueurs. Tu pourras ensuite te rattacher à ta fiche dans « Mon profil ».</p></section>`;
    return h+'</div>';
  }
  const last=played()[0];
  h+= last ? vBoard(last) : `<section class="board">${PITCH}<div class="in"><div class="meta">Aucun match saisi</div><div class="score"><div class="team">${esc(c.clubName)}</div><div class="big num">0<span>–</span>0</div><div class="team r">À venir</div></div>${S.canEdit?'<button class="btn primary" data-a="newmatch">Saisir un match</button>':''}</div></section>`;
  h+=nextCard();
  h+=leagueLink();
  h+=filtersBar();
  let V=0,N=0,D=0,bp=0,bc=0;
  for(const m of ms){ const r=result(m); if(r==='V')V++; if(r==='N')N++; if(r==='D')D++; if(isNum(m.scoreFor))bp+=m.scoreFor; if(isNum(m.scoreAgainst))bc+=m.scoreAgainst; }
  const form=ms.slice(0,5).map(result).filter(Boolean);
  h+=`<div class="kpis">
    <div class="kpi"><div class="v">${ms.length}</div><div class="l">Matchs</div></div>
    <div class="kpi"><div class="v">${V}-${N}-${D}</div><div class="l">Victoires, nuls, défaites</div></div>
    <div class="kpi"><div class="v">${bp}</div><div class="l">Buts marqués</div></div>
    <div class="kpi"><div class="v">${bc}</div><div class="l">Buts encaissés</div></div>
    <div class="kpi"><div class="v">${bp-bc>0?'+':''}${bp-bc}</div><div class="l">Différence</div></div>
    <div class="kpi"><div class="form-dots" style="margin:4px 0 6px">${form.length?form.map(r=>`<span class="dot ${r}">${r}</span>`).join(''):'<span class="muted">—</span>'}</div><div class="l">Forme, du plus récent</div></div>
  </div>`;
  if(!ms.length){ h+=`<p class="muted">Aucun match sur cette période.</p>`; return h+'</div>'; }
  const A=ps.map(p=>({p,a:agg(p.id,ms)})).filter(x=>x.a.n>0);
  const boards=[];
  const lb=(title,list,fmt,max)=>{ const top=list.slice(0,5); if(!top.length) return; const mx=max??Math.max(...top.map(x=>x.v),0);
    boards.push(`<section class="panel lb"><h3>${title}</h3>${top.length?`<ol>${top.map((x,i)=>`<li><span class="rk">${i+1}</span><div class="nm"><button class="link pl" data-a="player" data-v="${x.p.id}">${avatar(x.p.id,24)}<span>${esc(pname(x.p))}</span></button><div class="bar" style="width:${mx>0?Math.max(6,100*x.v/mx):6}%"></div></div><span class="val">${fmt(x)}</span></li>`).join('')}</ol>`:'<p class="empty">Pas encore de données.</p>'}</section>`); };
  const sortBy=(f)=>A.map(x=>({...x,v:f(x.a)})).filter(x=>x.v!=null&&x.v>0).sort((a,b)=>b.v-a.v);
  if(on('goals')) lb('Meilleurs buteurs',sortBy(a=>T(a,'goals')),x=>x.v);
  if(on('assists')) lb('Meilleurs passeurs',sortBy(a=>T(a,'assists')),x=>x.v);
  if(on('goals')&&on('assists')) lb('Buts + passes D par match',sortBy(a=>(T(a,'goals')+T(a,'assists'))/a.n),x=>nf(x.v,2));
  if(on('rating')) lb('Meilleure note moyenne',sortBy(a=>a.cnt.rating>=2?avg(a,'rating'):null),x=>nf(x.v,1),10);
  if(on('saves')&&on('conceded')) lb('Gardiens : % d\u2019arrêts',A.filter(x=>x.a.gkN>0&&(T(x.a,'saves')+T(x.a,'conceded'))>0).map(x=>({...x,v:100*T(x.a,'saves')/(T(x.a,'saves')+T(x.a,'conceded'))})).sort((a,b)=>b.v-a.v),x=>nf(x.v,0)+' %',100);
  lb('Homme du match',sortBy(a=>a.motm),x=>x.v);
  if(on('recoveries')) lb('Ballons récupérés',sortBy(a=>T(a,'recoveries')),x=>x.v);
  if(on('km')) lb('Distance moyenne par match',sortBy(a=>avg(a,'km')),x=>nf(x.v,2)+' km');
  lb('Matchs joués',sortBy(a=>a.n),x=>x.v);
  h+=`<div class="grid g3">${boards.join('')}</div>`;
  return h+'</div>';
}

function statCols(gk){
  return KPIS.filter(d=>on(d.k)&&((gk&&d.g==='gardien')||(!gk&&d.g!=='gardien')));
}
function vMatch(){
  const m=S.matches.find(x=>x.id===S.matchId);
  if(!m) return `<div class="panel"><p>Ce match n\u2019existe plus.</p><button class="btn" data-a="back">Retour aux matchs</button></div>`;

  const rows=Object.keys(m.stats||{}).map(pid=>({pid,r:rec(m,pid)})).filter(x=>x.r).sort((a,b)=>pname(player(a.pid)).localeCompare(pname(player(b.pid)),'fr'));
  const cols=statCols(false), gcols=statCols(true), gks=rows.filter(x=>x.r.gk);
  let h=`<div class="stack"><div class="spread"><button class="btn ghost" data-a="back">‹ Matchs</button>
    ${S.canEdit?`<div class="row"><button class="btn" data-a="editmatch" data-v="${m.id}">Modifier</button><button class="btn danger" data-a="delmatch" data-v="${m.id}">Supprimer</button></div>`:''}</div>`;
  h+=vBoard(m);
  h+=`<section class="panel"><h3>Feuille de match</h3>${rows.length?`<div class="tw"><table><thead><tr><th>Joueur</th><th>Min</th><th>Poids</th>${cols.map(d=>`<th title="${esc(d.l)}">${esc(d.s)}</th>`).join('')}</tr></thead><tbody>
    ${rows.map(({pid,r})=>{const w=weightAt(pid,m.date);return `<tr><td><button class="link" data-a="player" data-v="${pid}">${esc(pname(player(pid)))}</button>${r.gk?' <span class="muted small">(G)</span>':''}${m.motm===pid?' <span title="Homme du match">★</span>':''}</td><td>${nf(r.min)}</td><td>${w?nf(w.kg,1)+' kg':'—'}</td>${cols.map(d=>`<td>${nf(r[d.k],d.dec||d.rating?1:0)}</td>`).join('')}</tr>`;}).join('')}</tbody></table></div>`:'<p class="muted">Aucun joueur saisi sur ce match.</p>'}</section>`;
  const kms=rows.filter(x=>isNum(x.r.km)).sort((x,y)=>y.r.km-x.r.km);
  if(kms.length){ const mx=kms[0].r.km; h+=`<section class="panel"><h3>Distance parcourue</h3>${kms.map(({pid,r})=>`<div class="cmp wide"><button class="link pl" data-a="player" data-v="${pid}">${avatar(pid,24)}<span>${esc(shortName(player(pid)))}</span></button><div class="cb"><i style="width:${100*r.km/mx}%"></i></div><b>${nf(r.km,2)} km</b></div>`).join('')}</section>`; }
  if(gks.length&&gcols.length) h+=`<section class="panel"><h3>Gardiens</h3><div class="tw"><table><thead><tr><th>Gardien</th><th>Min dans les buts</th>${gcols.map(d=>`<th>${esc(d.s)}</th>`).join('')}<th>% arrêts</th></tr></thead><tbody>
    ${gks.map(({pid,r})=>`<tr><td>${esc(pname(player(pid)))}</td><td>${nf(r.gkMin)}</td>${gcols.map(d=>`<td>${nf(r[d.k])}</td>`).join('')}<td>${pct(r.saves||0,(r.saves||0)+(r.conceded||0))}</td></tr>`).join('')}</tbody></table></div></section>`;
  return h+'</div>';
}

/* ----- Saisie de match ----- */
function newDraft(){ return {id:rid(),date:today(),opponent:'',type:'championnat',place:'',scoreFor:0,scoreAgainst:0,duration:cfg().matchLength,stats:{},_new:true}; }
function stepper(pid,k,label,v,isRating){
  return `<div class="stp"><span class="lab">${esc(label)}</span><span class="ctl"><button type="button" data-a="step" data-p="${pid}" data-k="${k}" data-d="-1" aria-label="Retirer un ${esc(label)}">−</button><span class="val num" data-v="${pid}:${k}">${v==null?(isRating?'–':0):nf(v,1)}</span><button type="button" data-a="step" data-p="${pid}" data-k="${k}" data-d="1" aria-label="Ajouter un ${esc(label)}">+</button></span></div>`;
}
function vEditor(){
  const d=S.editing;
  const ps=players(false); // + joueurs retirés présents sur ce match
  for(const pid of Object.keys(d.stats)) if(!ps.find(p=>p.id===pid)&&d.stats[pid].present){ const p=player(pid); if(p) ps.push(p); }
  const fieldK=KPIS.filter(x=>on(x.k)&&(x.g==='jeu'||x.g==='discipline'));

  </div>
  <div class="steps" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">${stepper('_m','scoreFor','Buts marqués',d.scoreFor)}${stepper('_m','scoreAgainst','Buts encaissés',d.scoreAgainst)}</div>
  <div class="fields" style="margin-top:12px"><label class="f">Homme du match<select data-ef="motm"><option value="">${Object.values(d.stats).some(r=>r.present)?'Choisir un joueur':'Coche d\u2019abord les présents'}</option>${Object.entries(d.stats).filter(([,r])=>r.present).map(([pid])=>`<option value="${pid}" ${d.motm===pid?'selected':''}>${esc(pname(player(pid)))}</option>`).join('')}</select></label></div></section>
  <h3>Feuille de match</h3>

      <span class="nm">${esc(pname(p))}</span>
      <button class="tog" data-a="edpres" data-v="${p.id}" aria-pressed="${!!r.present}"><i></i>Présent</button></div>`;
    if(r.present){
      h+=`<div class="mini"><label class="f">Minutes jouées<input inputmode="numeric" data-ef="p:${p.id}:min" value="${esc(r.min??'')}"></label>
        <div style="display:flex;align-items:flex-end"><button class="tog" data-a="edgk" data-v="${p.id}" aria-pressed="${!!r.gk}"><i></i>Gardien</button></div>
        ${r.gk?`<label class="f">Min dans les buts<input inputmode="numeric" data-ef="p:${p.id}:gkMin" value="${esc(r.gkMin??'')}"></label>`:''}</div>`;

        <label class="btn sm" style="align-self:end">Importer un fichier<input type="file" accept="${ACCEPT}" data-imp="${p.id}" hidden></label></div>`;
    }
    h+=`</div>`;
  }
  h+=`</div><div class="checkbar" id="checkbar">${checks()}</div></div>`;
  return h;
}
function refreshChecks(){ const m=document.getElementById('chkmsg'); if(!m) return; const t=document.createElement('div'); t.innerHTML=checks(); m.innerHTML=t.firstElementChild.innerHTML; }
function checks(){
  const d=S.editing; const pres=Object.values(d.stats).filter(r=>r.present);
  const g=pres.reduce((s,r)=>s+(r.goals||0),0)-0, csc=0;
  const conc=pres.filter(r=>r.gk).reduce((s,r)=>s+(r.conceded||0),0);
  const msgs=[];
  if(on('goals')&&pres.length&&g!==d.scoreFor) msgs.push(`<span class="warn">${g} but(s) attribué(s) pour ${d.scoreFor} marqué(s)</span>`);
  if(on('conceded')&&pres.some(r=>r.gk)&&conc!==d.scoreAgainst) msgs.push(`<span class="warn">${conc} but(s) encaissé(s) par les gardiens pour ${d.scoreAgainst}</span>`);
  if(on('shotsOn')&&on('shots')&&pres.some(r=>(r.shotsOn||0)>(r.shots||0))) msgs.push(`<span class="warn">Plus de tirs cadrés que de tirs pour un joueur</span>`);
  if(!msgs.length) msgs.push(`<span class="okk">${pres.length} présent(s), feuille cohérente</span>`);
  return `<div id="chkmsg" style="flex:1;display:flex;flex-direction:column;gap:2px">${msgs.join('')}</div><button class="btn primary" data-a="edsave">Enregistrer le match</button>`;
}
function step(pid,k,dlt){
  const d=S.editing; const o=pid==='_m'?d:d.stats[pid]; if(!o) return;
  let v=o[k];
  if(KMAP[k]&&KMAP[k].rating){ v=v==null?6:v+dlt*.5; v=Math.max(0,Math.min(10,v)); }
  else v=Math.max(0,(v||0)+dlt);
  o[k]=v; S.editDirty=true;
  const el=document.querySelector(`[data-v="${pid}:${k}"]`); if(el) el.textContent=nf(v,1);
  refreshChecks();
}
async function saveMatch(){
  const d=S.editing;
  if(!d.date){ toast('Indique la date du match.'); return; }
  const stats={};
  for(const [pid,r] of Object.entries(d.stats)) if(r.present){
    const o={present:true,min:isNum(r.min)?r.min:(parseNum(d.duration)||cfg().matchLength)};
    if(r.gk){ o.gk=true; o.gkMin=isNum(r.gkMin)?r.gkMin:o.min; }
    for(const x of KPIS) if(isNum(r[x.k])) o[x.k]=r[x.k];
    stats[pid]=o;
  }
  const data={date:d.date,time:d.time||'',convoc:d.convoc||null,motm:(d.motm&&stats[d.motm])?d.motm:null,opponent:(d.opponent||'').trim(),type:d.type,place:(d.place||'').trim(),scoreFor:d.scoreFor,scoreAgainst:d.scoreAgainst,duration:parseNum(d.duration)||cfg().matchLength,stats,updatedAt:Date.now()};
  const id=d.id;
  if(await write('matches/'+id,data)){ S.editing=null; S.editDirty=false; S.matchId=id; toast('Match enregistré.'); go('m-'+id); render(); }
}

function nextCard(){
  const t=today(), m=upcoming().find(x=>x.date>=t); if(!m) return '';
  const c=convCounts(m);
  return `<button class="mrow" data-a="match" data-v="${m.id}" style="grid-template-columns:1fr auto"><div><div class="t">Prochain match, ${fdate(m.date,{weekday:'long',day:'numeric',month:'long'})}${m.time?' à '+esc(m.time):''}</div><div class="o">${esc(m.opponent||'Adversaire à confirmer')}</div><div class="t">${c.oui} présent(s), ${c.peutetre} peut-être, ${c.non} absent(s), ${c.attente} sans réponse</div></div><span class="btn sm">Convocation</span></button>`;
}
function convocMsg(m){
  const c=cfg(), conv=m.convoc||{};
  const by=st=>Object.keys(conv).filter(p=>(conv[p]||'attente')===st&&player(p)).map(p=>pname(player(p)));
  const all=Object.keys(conv).filter(p=>player(p)).map(p=>pname(player(p)));
  const L=[`⚽ ${c.clubName} : ${TYPES[m.type]||'match'} contre ${m.opponent||'adversaire à confirmer'}`,`📅 ${fdate(m.date,{weekday:'long',day:'numeric',month:'long'})}${m.time?' à '+m.time:''}`];
  if(m.place) L.push('📍 '+m.place);
  L.push('','Convoqués : '+(all.join(', ')||'personne pour l\u2019instant'));
  if(by('oui').length) L.push('✅ Présents : '+by('oui').join(', '));
  if(by('peutetre').length) L.push('🤔 Peut-être : '+by('peutetre').join(', '));
  if(by('non').length) L.push('❌ Absents : '+by('non').join(', '));
  if(by('attente').length) L.push('⏳ Sans réponse : '+by('attente').join(', '));
  L.push('','Merci de répondre présent ou absent 🙏');
  return L.join('\n');
}

    <div class="team" style="font-family:'Barlow Condensed',sans-serif;font-size:1.25rem;font-weight:600">${esc(cfg().clubName)} contre ${esc(m.opponent||'adversaire à confirmer')}</div></div></section>
  <div class="kpis"><div class="kpi"><div class="v">${c.oui}</div><div class="l">Présents</div></div><div class="kpi"><div class="v">${c.peutetre}</div><div class="l">Peut-être</div></div><div class="kpi"><div class="v">${c.non}</div><div class="l">Absents</div></div><div class="kpi"><div class="v">${c.attente}</div><div class="l">Sans réponse</div></div></div>

/* ----- Cotisations ----- */
const eur=v=>nf(v,2)+' €';
function seasonKey(off=0){ const y=+seasonStart().slice(0,4)+off; return y+'-'+(y+1); }
function feeDoc(k){ return S.fees.find(f=>f.id===k)||{id:k,amount:0,perPlayer:{},payments:[]}; }
function feeRows(f){
  const ids=new Set(players(false).map(p=>p.id));
  for(const p of f.payments||[]) ids.add(p.pid);
  for(const k of Object.keys(f.perPlayer||{})) ids.add(k);
  return [...ids].filter(id=>player(id)).map(id=>{
    const due=isNum((f.perPlayer||{})[id])?f.perPlayer[id]:(f.amount||0);
    const paid=(f.payments||[]).filter(x=>x.pid===id).reduce((s,x)=>s+(x.amount||0),0);
    return {p:player(id),due,paid,rest:Math.max(0,Math.round((due-paid)*100)/100)};
  }).sort((a,b)=>(b.rest-a.rest)||pname(a.p).localeCompare(pname(b.p),'fr'));
}
function feeStatus(r){
  if(r.due===0) return '<span class="st ex">Exonéré</span>';
  if(r.rest===0) return '<span class="st ok">À jour</span>';
  if(r.paid>0) return '<span class="st part">Partiel</span>';
  return '<span class="st due">À payer</span>';
}
function relanceMsg(k,rows){
  const late=rows.filter(r=>r.rest>0);
  if(!late.length) return 'Tout le monde est à jour de sa cotisation, merci à tous 🙌';
  return `💶 Rappel cotisation ${k.replace('-','/')} (${cfg().clubName})\n\n`+late.map(r=>`• ${pname(r.p)} : ${eur(r.rest)} restant${r.paid>0?' (déjà '+eur(r.paid)+' versés)':''}`).join('\n')+'\n\nMerci de régulariser dès que possible 🙏';
}

  <section class="panel"><div class="row" style="align-items:flex-end"><label class="f" style="max-width:200px">Montant par joueur (€)<input id="fee-amt" inputmode="decimal" value="${f.amount?esc(String(f.amount).replace('.',',')):''}" placeholder="Ex. 120"></label><button class="btn primary" data-a="feeamt" data-v="${k}">Enregistrer</button></div>

  h+=`<section class="panel"><h3>Par joueur</h3>${rows.length?rows.map(r=>{
    const open=S.feeOpen===r.p.id, pays=(f.payments||[]).filter(x=>x.pid===r.p.id).sort((a,b)=>b.date.localeCompare(a.date));

      ${r.due>0?`<div class="pbar"><i style="width:${Math.min(100,100*r.paid/r.due)}%"></i></div>`:''}
      ${open?`<div class="fbox"><div class="row" style="align-items:flex-end">
        <label class="f" style="max-width:130px">Montant (€)<input id="pay-amt" inputmode="decimal" value="${r.rest>0?esc(String(r.rest).replace('.',',')):''}"></label>
        <label class="f" style="max-width:170px">Date<input id="pay-date" type="date" value="${today()}"></label>
        <label class="f" style="max-width:170px">Moyen<select id="pay-mode">${PAYMODES.map(x=>`<option>${x}</option>`).join('')}</select></label>
        <button class="btn primary" data-a="paysave" data-v="${k}|${r.p.id}">Enregistrer le paiement</button></div>
        ${pays.length?`<div class="roster" style="margin-top:10px">${pays.map(x=>`<div class="r"><span class="nm">${fdate(x.date)}, ${esc(x.mode||'')}</span><b class="amt">${eur(x.amount)}</b><button class="btn ghost sm danger" data-a="paydel" data-v="${k}|${x.id}">Supprimer</button></div>`).join('')}</div>`:''}
        <div class="row" style="align-items:flex-end;margin-top:12px"><label class="f" style="max-width:220px">Montant dû pour lui (€)<input id="fee-due" inputmode="decimal" value="${isNum((f.perPlayer||{})[r.p.id])?esc(String(f.perPlayer[r.p.id]).replace('.',',')):''}" placeholder="${f.amount?'Standard : '+eur(f.amount):'Montant standard'}"></label><button class="btn sm" data-a="feedue" data-v="${k}|${r.p.id}">Appliquer</button></div>
        <p class="muted small">Laisse vide pour le montant standard, mets 0 pour l\u2019exonérer.</p></div>`:''}</div>`;
  }).join(''):'<p class="muted">Ajoute d\u2019abord des joueurs à l\u2019effectif.</p>'}</section>`;
  if(rows.length) h+=`<section class="panel"><h3>Relance</h3><p class="muted small">Message prêt à envoyer aux retardataires.</p><textarea id="relmsg" readonly rows="8">${esc(relanceMsg(k,rows))}</textarea><div class="row" style="margin-top:8px"><button class="btn" data-a="copy" data-v="relmsg">Copier la relance</button></div></section>`;
  return h+'</div>';
}

const PHOTO_RE=/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/;
function photoOf(pid){ const pr=profileOf(pid)||{}, p=player(pid)||{}; const ph=pr.photo||p.photo||null; return ph&&PHOTO_RE.test(ph)?ph:null; }
function avatar(pid,size=44){

}
async function photoFromFile(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; });
    const s0=Math.min(img.naturalWidth,img.naturalHeight), sz=320, c=document.createElement('canvas'); c.width=c.height=sz;
    c.getContext('2d').drawImage(img,(img.naturalWidth-s0)/2,(img.naturalHeight-s0)/2,s0,s0,0,0,sz,sz);
    return c.toDataURL('image/jpeg',0.82);
  } finally { URL.revokeObjectURL(url); }
}

/* ----- Graphiques équipe et physique ----- */
function teamChart(ms){
  const rows=ms.filter(m=>isNum(m.scoreFor)&&isNum(m.scoreAgainst)).slice(0,12).reverse();
  if(!rows.length) return '<p class="muted small">Pas encore de match joué.</p>';
  const W=560,H=150,pad=22, step=(W-pad)/rows.length, bw=Math.min(16,step/2-3);
  const mx=Math.max(1,...rows.map(m=>Math.max(m.scoreFor,m.scoreAgainst)));
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Buts marqués et encaissés par match">`;
  for(let y=0;y<=mx;y+=Math.max(1,Math.ceil(mx/4))){ const yy=H-(y/mx)*(H-10); s+=`<line x1="${pad}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="0" y="${yy+4}" font-size="11" fill="var(--muted)">${y}</text>`; }
  rows.forEach((m,i)=>{ const x=pad+i*step+step/2-bw-1, hf=(m.scoreFor/mx)*(H-10), ha=(m.scoreAgainst/mx)*(H-10);
    s+=`<rect x="${x}" y="${H-hf}" width="${bw}" height="${hf}" fill="var(--turf)" rx="2"><title>${esc(m.opponent||'Match')} : ${m.scoreFor} marqué(s)</title></rect><rect x="${x+bw+2}" y="${H-ha}" width="${bw}" height="${ha}" fill="var(--loss)" rx="2" opacity=".85"><title>${esc(m.opponent||'Match')} : ${m.scoreAgainst} encaissé(s)</title></rect>`;
    s+=`<text x="${x+bw+1}" y="${H+15}" font-size="10" text-anchor="middle" fill="var(--muted)">${fdate(m.date,{day:'numeric',month:'numeric'})}</text>`; });
  return s+'</svg>';
}
function kmChart(rows){
  const W=560,H=160,pad=26, step=(W-pad)/rows.length, bw=Math.min(30,step-8);
  const v=rows.map(x=>x.r.km), mx=Math.max(...v)*1.15, av=v.reduce((a,b)=>a+b,0)/v.length, Y=k=>H-(k/mx)*(H-14);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Distance parcourue par match">`;
  rows.forEach(({m,r},i)=>{ const x=pad+i*step+(step-bw)/2;
    s+=`<rect x="${x}" y="${Y(r.km)}" width="${bw}" height="${H-Y(r.km)}" fill="var(--bib)" rx="3"><title>${esc(m.opponent||'Match')}, ${fdate(m.date)} : ${nf(r.km,2)} km</title></rect>`;
    s+=`<text x="${x+bw/2}" y="${Y(r.km)-4}" font-size="11" font-weight="600" text-anchor="middle" fill="var(--ink)">${nf(r.km,1)}</text>`;
    s+=`<text x="${x+bw/2}" y="${H+15}" font-size="10" text-anchor="middle" fill="var(--muted)">${fdate(m.date,{day:'numeric',month:'numeric'})}</text>`; });
  s+=`<line x1="${pad}" x2="${W}" y1="${Y(av)}" y2="${Y(av)}" stroke="var(--turf)" stroke-width="2" stroke-dasharray="6 4"/><text x="${pad}" y="${Y(av)-5}" font-size="11" fill="var(--turf)">moyenne ${nf(av,1)} km</text>`;
  return s+'</svg>';
}
function teamIntensity(ms){ let km=0,min=0; for(const m of ms) for(const pid of Object.keys(m.stats||{})){ const r=rec(m,pid); if(r&&isNum(r.km)){ km+=r.km; min+=isNum(r.min)?r.min:(m.duration||cfg().matchLength); } } return min?km/min*10:null; }
function physique(pid,a,ms,isMe){
  const kr=a.rows.filter(x=>isNum(x.r.km)), hr=a.rows.filter(x=>isNum(x.r.hrAvg));
  if(!kr.length&&!hr.length){
    return isMe&&on('km')?`<section class="panel"><h3>Physique</h3><p class="muted">Importe les données de ta montre dans « Mon profil » : distance, cardio et vitesse s\u2019afficheront ici en graphiques.</p><button class="btn sm" data-a="nav" data-v="profil">Importer mes séances</button></section>`:'';
  }
  const km=kr.reduce((s,x)=>s+x.r.km,0), best=kr.slice().sort((x,y)=>y.r.km-x.r.km)[0];
  let mn=0; for(const {m,r} of kr) mn+=isNum(r.min)?r.min:(m.duration||cfg().matchLength);
  const inten=mn?km/mn*10:null, tInt=teamIntensity(ms);
  const hrAvg=hr.length?hr.reduce((s,x)=>s+x.r.hrAvg,0)/hr.length:null;
  const hrMax=Math.max(0,...a.rows.map(x=>x.r.hrMax||0))||null, vmax=Math.max(0,...a.rows.map(x=>x.r.vmax||0))||null;
  const tiles=[
    kr.length?['Par match',nf(km/kr.length,2)+' km']:null,
    best?['Record',nf(best.r.km,2)+' km',(best.m.opponent||'')+' '+fdate(best.m.date,{day:'numeric',month:'short'})]:null,
    inten?['Intensité',nf(inten,2)+' km','par 10 min de jeu']:null,
    hrAvg?['Cardio moyen',nf(hrAvg,0)+' bpm']:null,
    hrMax?['Cardio max',nf(hrMax,0)+' bpm']:null,
    vmax?['Vitesse max',nf(vmax,1)+' km/h']:null
  ].filter(Boolean);
  let h=`<section class="board phys">${PITCH}<div class="in">
    <div class="meta">Physique, ${kr.length} match${kr.length>1?'s':''} avec montre</div>
    ${kr.length?`<div class="pbig num">${nf(km,1)}<small> km</small></div><div class="meta">parcourus, soit environ ${nf(Math.round(km*1000/40))} longueurs de terrain de foot 5</div>`:''}
    <div class="phys-grid">${tiles.map(t=>`<div><b>${t[1]}</b><span>${esc(t[0])}${t[2]?'<br>'+esc(t[2]):''}</span></div>`).join('')}</div></div></section>`;
  if(kr.length){
    const mxI=Math.max(inten||0,tInt||0)||1;
    h+=`<section class="panel"><h3>Distance match après match</h3>${kmChart(kr.slice(0,12).reverse())}
      ${inten&&tInt?`<p class="sub">Intensité comparée (km par 10 min)</p><div class="cmp"><span>Ce joueur</span><div class="cb"><i style="width:${100*inten/mxI}%"></i></div><b>${nf(inten,2)}</b></div><div class="cmp t"><span>Moyenne équipe</span><div class="cb"><i style="width:${100*tInt/mxI}%"></i></div><b>${nf(tInt,2)}</b></div>`:''}</section>`;
  }
  return h;
}

    h+=`<div class="grid g2"><section class="panel"><h3>Ratios</h3><div class="ratios">${ratiosFor(a).map(r=>`<div class="ratio"><span class="l">${esc(r.l)}</span><span class="v">${r.v}</span>${r.h?`<span class="h">${esc(r.h)}</span>`:''}</div>`).join('')}</div></section>`;

}

function barChart(rows){
  if(!rows.length) return '<p class="muted small">Pas encore de match.</p>';
  const W=560,H=150,pad=22,bw=Math.min(28,(W-pad)/rows.length-6);
  const mx=Math.max(1,...rows.map(r=>r.a+r.b));
  const step=(W-pad)/rows.length;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H+20}" role="img" aria-label="Buts et passes décisives par match">`;
  for(let y=0;y<=mx;y+=Math.max(1,Math.ceil(mx/4))){ const yy=H-(y/mx)*(H-10); s+=`<line x1="${pad}" x2="${W}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="0" y="${yy+4}" font-size="11" fill="var(--muted)">${y}</text>`; }
  rows.forEach((r,i)=>{ const x=pad+i*step+(step-bw)/2; const ha=(r.a/mx)*(H-10), hb=(r.b/mx)*(H-10);
    s+=`<rect x="${x}" y="${H-ha}" width="${bw}" height="${ha}" fill="var(--turf)" rx="2"><title>${esc(r.t)} : ${r.a} but(s)</title></rect><rect x="${x}" y="${H-ha-hb}" width="${bw}" height="${hb}" fill="var(--bib)" rx="2"><title>${esc(r.t)} : ${r.b} passe(s)</title></rect>`;
    s+=`<text x="${x+bw/2}" y="${H+15}" font-size="10" text-anchor="middle" fill="var(--muted)">${esc(r.lab)}</text>`; });
  return s+'</svg>';
}
function lineChart(pts, matchDates){
  if(pts.length<1) return '<p class="muted small">Aucune pesée pour l\u2019instant.</p>';
  const W=560,H=150,padL=34,padB=20;
  const t=pts.map(p=>new Date(p.d+'T12:00').getTime()); const md=(matchDates||[]).map(d=>new Date(d+'T12:00').getTime());
  let t0=Math.min(...t,...md), t1=Math.max(...t,...md); if(t1===t0){t0-=864e5*15;t1+=864e5*15;}
  const kg=pts.map(p=>p.kg); let k0=Math.min(...kg)-1, k1=Math.max(...kg)+1;
  const X=v=>padL+(v-t0)/(t1-t0)*(W-padL-8), Y=v=>8+(1-(v-k0)/(k1-k0))*(H-padB-8);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Évolution du poids">`;
  [k0,(k0+k1)/2,k1].forEach(v=>{s+=`<line x1="${padL}" x2="${W}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="0" y="${Y(v)+4}" font-size="11" fill="var(--muted)">${nf(v,1)}</text>`;});
  md.forEach(v=>{s+=`<line x1="${X(v)}" x2="${X(v)}" y1="${H-padB}" y2="${H-padB-6}" stroke="var(--muted)"/>`;});
  s+=`<polyline fill="none" stroke="var(--bib)" stroke-width="2.5" points="${pts.map((p,i)=>X(t[i])+','+Y(p.kg)).join(' ')}"/>`;
  pts.forEach((p,i)=>{s+=`<circle cx="${X(t[i])}" cy="${Y(p.kg)}" r="4" fill="var(--bib)"><title>${fdate(p.d)} : ${nf(p.kg,1)} kg</title></circle>`;});
  s+=`<text x="${padL}" y="${H-4}" font-size="10" fill="var(--muted)">${fdate(new Date(t0).toISOString().slice(0,10),{month:'short',year:'2-digit'})}</text><text x="${W}" y="${H-4}" font-size="10" text-anchor="end" fill="var(--muted)">${fdate(new Date(t1).toISOString().slice(0,10),{month:'short',year:'2-digit'})}</text>`;
  return s+'</svg>';
}
function leagueLink(){

  for(const m of played()){ const r=rec(m,d.playerId); if(r&&(isNum(r.km)||isNum(r.hrAvg)))

/* ---------- Import GPX / TCX ---------- */
function parseTrack(text){
  const xml=new DOMParser().parseFromString(text,'application/xml');
  if(xml.getElementsByTagName('parsererror').length) throw new Error('Fichier illisible');
  const by=(el,t)=>el?Array.from(el.getElementsByTagNameNS('*',t)):[];
  const tx=(el,t)=>{const e=by(el,t)[0];return e?e.textContent.trim():'';};
  let pts=[], lapDist=0, lapTime=0, hrA=[], hrM=[];
  const tps=by(xml,'Trackpoint');
  if(tps.length){
    for(const lap of by(xml,'Lap')){ lapDist+=+tx(lap,'DistanceMeters')||0; lapTime+=+tx(lap,'TotalTimeSeconds')||0;
      const a=by(lap,'AverageHeartRateBpm')[0], m=by(lap,'MaximumHeartRateBpm')[0]; if(a) hrA.push(+tx(a,'Value')); if(m) hrM.push(+tx(m,'Value')); }
    pts=tps.map(tp=>{const hr=by(tp,'HeartRateBpm')[0];return {t:Date.parse(tx(tp,'Time')),lat:parseFloat(tx(tp,'LatitudeDegrees')),lon:parseFloat(tx(tp,'LongitudeDegrees')),hr:hr?+tx(hr,'Value'):null,d:tx(tp,'DistanceMeters')!==''?parseFloat(tx(tp,'DistanceMeters')):null};});
  } else {
    pts=by(xml,'trkpt').map(tp=>({t:Date.parse(tx(tp,'time')),lat:parseFloat(tp.getAttribute('lat')),lon:parseFloat(tp.getAttribute('lon')),hr:parseFloat(tx(tp,'hr'))||null}));
  }
  if(!pts.length&&!lapDist) throw new Error('Aucun point trouvé');
  const R=6371000, rad=x=>x*Math.PI/180;
  const hav=(a,b)=>{const dLa=rad(b.lat-a.lat),dLo=rad(b.lon-a.lon);const h=Math.sin(dLa/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(h));};
  const geo=pts.filter(p=>isFinite(p.lat)&&isFinite(p.lon)&&isFinite(p.t));
  let dist=0, vmax=0;
  for(let i=1;i<geo.length;i++) dist+=hav(geo[i-1],geo[i]);
  for(let i=0,j=0;i<geo.length;i++){ while(j<geo.length&&geo[j].t-geo[i].t<5000) j++; if(j>=geo.length) break;
    let dd=0; for(let k=i+1;k<=j;k++) dd+=hav(geo[k-1],geo[k]); const v=dd/((geo[j].t-geo[i].t)/1000)*3.6; if(v<40&&v>vmax) vmax=v; }
  const km=(lapDist||dist)/1000;
  const times=pts.map(p=>p.t).filter(isFinite);
  const min=lapTime?lapTime/60:(times.length>1?(Math.max(...times)-Math.min(...times))/60000:null);
  const hrs=pts.map(p=>p.hr).filter(v=>isFinite(v)&&v>30);
  const hrAvg=hrs.length?hrs.reduce((s,v)=>s+v,0)/hrs.length:(hrA.length?hrA.reduce((s,v)=>s+v,0)/hrA.length:null);
  const hrMax=hrs.length?Math.max(...hrs):(hrM.length?Math.max(...hrM):null);
  const r2=v=>v==null?null:Math.round(v*100)/100;
  const t0=times.length?new Date(Math.min(...times)):null;
  const date=t0?t0.getFullYear()+'-'+String(t0.getMonth()+1).padStart(2,'0')+'-'+String(t0.getDate()).padStart(2,'0'):null;
  return {pts:pts.filter(p=>isFinite(p.t)),date,km:km>0?r2(km):null,min:min?Math.round(min):null,hrAvg:hrAvg?Math.round(hrAvg):null,hrMax:hrMax?Math.round(hrMax):null,vmax:vmax>0?Math.round(vmax*10)/10:null};
}
